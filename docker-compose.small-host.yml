# Overlay for a shared 1 vCPU / 1 GB test host. Build images elsewhere.
# docker compose -f docker-compose.yml -f docker-compose.small-host.yml up -d --no-build
services:
  nopcommerce_web:
    # Give Razor/localization enough headroom without letting the app thrash swap.
    # Web + PostgreSQL + certificate helper remain capped at 432 MiB of RAM.
    mem_limit: 352m
    memswap_limit: 352m
    cpus: 0.35
  nopcommerce_database:
    mem_limit: 64m
    memswap_limit: 96m
    cpus: 0.15
  certificates:
    cpus: 0.10
